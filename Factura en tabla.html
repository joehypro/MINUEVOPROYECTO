<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura en tabla</title>
</head>
<body>
    <h1>Tabla</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Descripcion</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Producto A</td>
                <td>15.00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total: 15.00</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
