         contactEmail.value === '' ||
          contactMessage.valie === '' 
        )
          {
            message.classList.add('color-red')

            message.textContent = 'Write all the input fields.';

            setTimeout(() => {
              message.textContent = ''
            }, 3000)
          }
      };

      contactForm.addEventListener('subtmit', sendEmail)
    </script>
